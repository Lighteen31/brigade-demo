<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brigade">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Brigade Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-first column (max 600px) between a frosted header and a frosted tab bar.
   Large titles open each screen, then a bento grid of very rounded cards.
   Dark night-service look by default; the light look applies when the viewer picks light. */
:root{
  color-scheme: dark;
  --bg:#000000;
  --surface:#111111;
  --surface-2:#1C1C1E;
  --surface-3:#2C2C2E;
  --seg-on:#3A3A3C;
  --sheet:#1C1C1E;
  --sheet-2:#2C2C2E;
  --text:#F5F5F7;
  --text-2:#86868B;
  --text-2b:#98989D;
  --hair:rgba(255,255,255,.08);
  --gold:#C9A96E;
  --gold-text:#C9A96E;
  --gold-ink:#1A1306;
  --gold-soft:rgba(201,169,110,.15);
  --good:#6FD08C;
  --good-soft:rgba(111,208,140,.13);
  --bad:#FF8178;
  --bad-soft:rgba(255,129,120,.14);
  --warn:#F5BC63;
  --warn-soft:rgba(245,188,99,.12);
  --on-state:#000000;
  --ring-2:#F5F5F7;
  --ring-3:#86868B;
  --glass:rgba(12,12,14,.72);
  --scrim:rgba(0,0,0,.55);
  --shadow:0 0 0 1px var(--hair);
  --shadow-up:0 -12px 40px rgba(0,0,0,.5);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",system-ui,sans-serif;
  --ease:cubic-bezier(.25,.1,.25,1);
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --sheet-ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --r:24px;
  --r-lg:28px;
  --r-sm:16px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#F5F5F7;
  --surface:#FFFFFF;
  --surface-2:#F0F0F3;
  --surface-3:#E3E3E8;
  --seg-on:#FFFFFF;
  --sheet:#FFFFFF;
  --sheet-2:#F2F2F5;
  --text:#1D1D1F;
  --text-2:#66666B;
  --text-2b:#66666B;
  --hair:rgba(0,0,0,.08);
  --gold:#C9A96E;
  --gold-text:#85652A;
  --gold-ink:#1A1306;
  --gold-soft:rgba(201,169,110,.2);
  --good:#1A7232;
  --good-soft:rgba(26,114,50,.1);
  --bad:#B32F28;
  --bad-soft:rgba(179,47,40,.09);
  --warn:#965800;
  --warn-soft:rgba(214,140,30,.13);
  --on-state:#FFFFFF;
  --ring-2:#3A3A3C;
  --ring-3:#A1A1A6;
  --glass:rgba(245,245,247,.74);
  --scrim:rgba(0,0,0,.3);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --shadow-up:0 -12px 40px rgba(0,0,0,.12);
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
html.locked,html.locked body{overflow:hidden}
body{color:var(--text);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
p,h1,h2,h3,h4,ol,ul,blockquote{margin:0}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.num,.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.small{font-size:14px}
.tiny{font-size:12px;color:var(--text-2)}
.stack{display:flex;flex-direction:column;gap:12px}

.wrap{max-width:600px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* Press feedback and motion */
button,.chip{transition:transform .26s var(--ease-out),background-color .25s var(--ease),color .25s var(--ease),box-shadow .25s var(--ease),border-color .25s var(--ease),opacity .25s var(--ease)}
button:active:not([disabled]){transform:scale(.97)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes podUp{from{transform:scaleY(.08)}to{transform:none}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.04)}70%{transform:scale(.99)}100%{transform:scale(1)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(201,169,110,0)}30%{box-shadow:0 0 0 5px rgba(201,169,110,.3),0 0 36px rgba(201,169,110,.45)}100%{box-shadow:0 0 0 0 rgba(201,169,110,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}36%{transform:translateX(8px)}54%{transform:translateX(-5px)}72%{transform:translateX(3px)}}
@keyframes bubIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.enter > .view > *{animation:rise .42s var(--ease-out) backwards}
.enter > .view > *:nth-child(2){animation-delay:.05s}
.enter > .view > *:nth-child(3){animation-delay:.1s}
.enter > .view > *:nth-child(4){animation-delay:.15s}
.enter > .view > *:nth-child(5){animation-delay:.2s}
.enter > .view > *:nth-child(n+6){animation-delay:.24s}
.enter .bento > *{animation:rise .42s var(--ease-out) backwards}
.enter .bento > *:nth-child(1){animation-delay:.08s}
.enter .bento > *:nth-child(2){animation-delay:.13s}
.enter .bento > *:nth-child(3){animation-delay:.18s}
.enter .bento > *:nth-child(4){animation-delay:.22s}
.enter .bento > *:nth-child(5){animation-delay:.26s}
.enter .bento > *:nth-child(n+6){animation-delay:.3s}
.enter .grid-items > *{animation:rise .4s var(--ease-out) backwards}
.enter .grid-items > *:nth-child(2){animation-delay:.04s}
.enter .grid-items > *:nth-child(3){animation-delay:.08s}
.enter .grid-items > *:nth-child(4){animation-delay:.12s}
.enter .grid-items > *:nth-child(n+5){animation-delay:.16s}
.enter .pod-block{animation:podUp .6s var(--ease-out) .25s backwards}
.ring-v{transition:stroke-dashoffset 1.1s var(--ease-out)}
.ring-v.zero{stroke-opacity:0}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair)}
.top-in{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.brand-row,.role-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:5px;font-size:21px;font-weight:700;letter-spacing:-.035em;line-height:1}
.logo-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:6px}
.venue{display:block;margin-top:5px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.demo-tag{font-size:12.5px;color:var(--text-2)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:var(--surface-2);flex:none}
.seg button{position:relative;border:0;background:transparent;color:var(--text-2);font-weight:600;font-size:13px;letter-spacing:-.005em;height:32px;padding:0 14px;border-radius:999px;cursor:pointer}
.seg button::before{content:"";position:absolute;inset:-6px -1px}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* Page */
main.wrap{padding-block:8px calc(124px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:24px}
.hero{display:flex;flex-direction:column;gap:10px;padding-top:24px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.eyebrow.gold{color:var(--gold-text)}
.title{font-size:clamp(42px,12vw,64px);font-weight:800;letter-spacing:-.045em;line-height:1;text-wrap:balance}
.title.md{font-size:clamp(34px,9vw,48px)}
.lede{font-size:17px;line-height:1.45;color:var(--text-2);max-width:34em}
.lede .num{color:var(--text);font-weight:600}
.sec-h{font-size:22px;font-weight:700;letter-spacing:-.025em;margin-bottom:12px}
.card-h{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);margin-bottom:6px}

/* Bento and cards */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.span2{grid-column:1/-1}
@media (max-width:359px){.bento{grid-template-columns:1fr}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;min-width:0;position:relative}
button.card{display:block;width:100%;text-align:left;border:0;cursor:pointer}

/* Buttons and pills */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:999px;border:0;font-weight:600;font-size:17px;letter-spacing:-.015em;cursor:pointer;background:var(--surface-2);color:var(--text)}
.btn.primary{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--hair)}
.btn.sm{min-height:44px;padding:0 20px;font-size:15px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.link{display:inline-flex;align-items:center;min-height:44px;background:none;border:0;padding:0 4px;color:var(--gold-text);font-weight:600;font-size:15px;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--surface-2);color:var(--text);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.gold{background:var(--gold-soft);color:var(--gold-text)}
.pill svg{flex:none}
.chev{color:var(--text-2);display:inline-flex}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.tag.special{background:var(--gold-soft);color:var(--gold-text)}
.tag.imported{background:var(--surface-2);color:var(--text-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;border-radius:999px;padding:5px 11px;background:var(--surface-2);color:var(--text);border:0}
.chip.alg{background:var(--bad-soft);color:var(--bad)}
.chip.toggle,.chip.check{position:relative;min-height:36px;padding:0 15px;font-size:14px;cursor:pointer}
.chip.toggle::before,.chip.check::before{content:"";position:absolute;inset:-4px -2px}
.chip.toggle{color:var(--text-2)}
.chip.toggle[aria-pressed="true"]{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 45%,transparent)}
.chip.check{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--warn) 60%,transparent);border:0}
.chip.check[aria-pressed="true"]{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}

/* Rings, counters, bars */
.ring-wrap{position:relative;display:inline-grid;place-items:center;flex:none}
.ring-wrap svg{display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;text-align:center}
.ring-center b{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring-center small{font-size:12px;color:var(--text-2);margin-top:4px}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .9s var(--ease-out)}
.bar.warn i{background:var(--bad)}
.legend{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.legend li{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px;color:var(--text-2)}
.legend b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%}
.d1{background:var(--gold)}.d2{background:var(--ring-2)}.d3{background:var(--ring-3)}

/* Today */
.brief-card{display:grid!important;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:24px;overflow:hidden;border-radius:var(--r-lg)}
.brief-card::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(201,169,110,.75),rgba(201,169,110,0) 42%,rgba(201,169,110,0) 62%,rgba(201,169,110,.35));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.brief-glow{position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(closest-side,rgba(201,169,110,.22),rgba(201,169,110,0));pointer-events:none}
.brief-text{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.brief-title{font-size:clamp(26px,7vw,32px);font-weight:800;letter-spacing:-.04em;line-height:1.05;text-wrap:balance}
.brief-sub{font-size:15px;color:var(--text-2)}
.brief-text .btn{align-self:flex-start;margin-top:12px}
.brief-card.done .btn{background:var(--surface-2);color:var(--text)}
.rings-card,.xp-card{display:flex;flex-direction:column;gap:12px}
.rings-card .ring-wrap{align-self:center;margin-block:4px}
.stat{font-size:clamp(40px,11vw,52px);font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.stat.gold{color:var(--gold-text)}
.xp-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.special-card{display:flex!important;flex-direction:column;gap:6px;padding:22px}
.sp-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-size:14px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sp-name{font-size:26px;font-weight:700;letter-spacing:-.035em;line-height:1.12;margin-top:6px}
.sp-desc{font-size:15px;color:var(--text-2)}
.sp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.list-rows{display:flex;flex-direction:column}
.list-rows > *+*{border-top:1px solid var(--hair)}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;min-height:60px;padding:14px 0;background:none;border:0;border-radius:0;text-align:left;cursor:pointer}
.lr-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.t1{font-size:16px;font-weight:600;letter-spacing:-.015em}
.t2{font-size:14px;color:var(--text-2)}
.b86{font-size:13px;font-weight:800;color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:6px 9px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tl-row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;padding:14px 0;align-items:baseline;font-size:15.5px}
.tl-time{font-weight:700;color:var(--gold-text);font-variant-numeric:tabular-nums}
.tbl{display:inline-block;font-size:12px;font-weight:700;background:var(--surface-2);border-radius:8px;padding:2px 8px;margin-right:4px;font-variant-numeric:tabular-nums}
.show{display:flex;gap:18px;align-items:center;margin-top:6px}
.show-time{font-size:46px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;flex:none}
.show-text{font-size:15.5px;line-height:1.4}

/* Podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;margin-top:18px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:-.02em;flex:none}
.avatar.sm{width:38px;height:38px;font-size:13px}
.p1 .avatar{width:58px;height:58px;font-size:18px;box-shadow:0 0 0 2px var(--gold),0 0 24px rgba(201,169,110,.35)}
.pod.me .avatar,.lb-row.me-row .avatar{box-shadow:0 0 0 2px var(--gold)}
.pod-name{font-size:13.5px;font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.pod.me .pod-name{color:var(--gold-text)}
.pod-xp{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.pod-block{width:100%;border-radius:16px 16px 8px 8px;background:var(--surface-2);display:flex;justify-content:center;padding-top:10px;transform-origin:bottom}
.pod-block b{font-size:22px;font-weight:800;color:var(--text-2)}
.p1 .pod-block{background:linear-gradient(180deg,var(--gold-soft),var(--surface-2))}
.p1 .pod-block b{color:var(--gold-text)}
.lb{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.lb-row{display:grid;grid-template-columns:24px 38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border-radius:16px;font-variant-numeric:tabular-nums}
.lb-row .rk{color:var(--text-2);font-weight:700;font-size:14px}
.lb-row .lb-name{font-weight:600;font-size:15px;min-width:0;overflow-wrap:anywhere}
.lb-row .lb-xp{font-size:14px;color:var(--text-2)}
.lb-row.me-row{background:var(--gold-soft)}
.lb-row.me-row .lb-name,.lb-row.me-row .lb-xp{color:var(--gold-text)}

/* Bible */
.segctl{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.segctl::-webkit-scrollbar{display:none}
.segctl button{flex:none;height:40px;padding:0 18px;border-radius:999px;border:0;background:var(--surface-2);color:var(--text-2);font-weight:600;font-size:15px;cursor:pointer}
.segctl button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.prog-card{display:flex;align-items:center;gap:16px;padding:16px 20px}
.prog-text{display:flex;flex-direction:column;gap:2px}
.prog-text b{font-size:16px;font-weight:600}
.filter{display:flex;flex-direction:column;gap:10px}
.hidden-note{font-size:13px;color:var(--text-2)}
.grid-items{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.grid-items{grid-template-columns:repeat(2,minmax(0,1fr))}}
.item-card{display:flex!important;flex-direction:column;gap:8px;padding:20px}
.ic-top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:24px}
.ic-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.ic-origin{font-size:12.5px;color:var(--text-2)}
.ic-name{font-size:21px;font-weight:700;letter-spacing:-.03em;line-height:1.18}
.ic-desc{font-size:15px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ic-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.read{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text-2)}
.read.on svg{color:var(--gold-text)}
.item-card.is-pending{box-shadow:var(--shadow),inset 0 0 0 1px color-mix(in srgb,var(--warn) 35%,transparent)}

/* Bottle service */
.fmt-head,.fmt{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 40px 30px 44px;gap:8px;align-items:center}
.fmt-head{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);padding:8px 0}

.timer.low{color:var(--bad);background:var(--bad-soft)}
.segbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.segbar i{height:4px;border-radius:2px;background:var(--surface-3);transition:background-color .3s var(--ease)}
.segbar i.on{background:var(--gold)}
.q{font-size:clamp(28px,7.6vw,38px);font-weight:800;letter-spacing:-.04em;line-height:1.1;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:14px 18px;border:0;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);text-align:left;font-size:17px;font-weight:500;letter-spacing:-.015em;cursor:pointer}

.opt .key{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--text-2)}
.opt.right{background:var(--good-soft);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--good) 60%,transparent)}

.opt.wrong{background:var(--bad-soft);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bad) 60%,transparent)}
.opt.wrong .key{background:var(--bad);color:var(--on-state)}
.opt.dim{opacity:.55}
.opt.pop{animation:pop .5s var(--spring),glow 1.3s var(--ease)}
.opt.shake{animation:shake .42s var(--ease)}
.verdict-card{font-size:16px;line-height:1.45;animation:rise .35s var(--ease-out) backwards}
.verdict{font-weight:700}
.verdict.ok{color:var(--good)}

.scen-sub{grid-column:1;font-size:14.5px;color:var(--text-2)}

.sh-block p{font-size:16px;line-height:1.45}

.warn-box svg{flex:none;margin-top:2px}
.say{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sh-grid > :only-child{grid-column:1/-1}
.say-ph{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--gold-text)}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px)}

.nav svg{width:26px;height:26px}
.badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--warn);color:var(--on-state);font-size:11px;font-weight:800;line-height:18px;text-align:center}
:root[data-theme="light"] .badge{color:#FFFFFF}

.toast{position:fixed;left:0;right:0;margin-inline:auto;width:max-content;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:70;max-width:calc(100% - 40px);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--text);box-shadow:var(--shadow),0 12px 32px rgba(0,0,0,.25);font-weight:600;font-size:15px;padding:12px 20px;border-radius:999px;animation:rise .3s var(--ease-out) backwards}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
</style>
</head>

/* ---------- Visual helpers: counters, bars, rings ---------- */
const count = (key, v) => `<span class="num" data-count="${Number(v) || 0}" data-key="${key}">${fmtNum(Number(v) || 0)}</span>`;
const barAttr = (key, v) => { const w = Math.max(0, Math.min(100, Number(v) || 0)); return `data-bar="${key}" data-v="${w}" style="width:${w}%"`; };
function arc(key, v, c, r, sw, color){
  const C = 2 * Math.PI * r, val = Math.max(0, Math.min(100, Math.round(Number(v) || 0)));
  return `<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:${color};stroke-opacity:.2" stroke-width="${sw}"/>`
    + `<circle class="ring-v${val <= 0 ? " zero" : ""}" data-key="${key}" data-c="${C.toFixed(2)}" data-v="${val}" cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - val / 100)).toFixed(2)}" transform="rotate(-90 ${c} ${c})"/>`;
}
function ring1(key, v, size, sw, color){
  const c = size / 2, r = (size - sw) / 2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${arc(key, v, c, r, sw, color || "var(--gold)")}</svg>`;
}
function rings(key, vals, size, sw, gap){
  sw = sw || 11; gap = gap == null ? 3 : gap;
  const c = size / 2, cols = ["var(--gold)", "var(--ring-2)", "var(--ring-3)"];
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${vals.map((v, i) => { const r = (size - sw) / 2 - i * (sw + gap); return r > sw / 2 ? arc(`${key}-${i}`, v, c, r, sw, cols[i]) : ""; }).join("")}</svg>`;
}

async function sendWaiter(){
  const p = state.practice; if(!p || p.busy) return;
  const text = p.draft.trim(); if(!text) return;
  const sc = SCEN[p.id];
  p.turns.push({who:"waiter", text}); p.draft = ""; p.err = null; p.busy = true;
  p.turns.push({who:"guest", text:"", pending:true});
  render(); scrollChat();
  const s = await samplePromise;
  let reply = null;
  if(s && !aiDenied){
    const ctl = new AbortController(); p.ctl = ctl;
    const input = [{role:"user", content:guestRules(sc)}, ...p.turns.filter(x => !x.opener && !x.pending).map(x => ({role: x.who==="waiter" ? "user" : "assistant", content:x.text}))];
    try{
      const r = await s(input, {cache:false, modelTier:"quick", signal:ctl.signal, onText:({text}) => { const b = $("#pendingBubble"); if(b) b.textContent = text; }});
      reply = r.text;
    }catch(e){
      if(e && GATED.includes(e.code)){ aiDenied = true; p.scripted = true; }
      else if(e && e.code === "cancelled"){ p.turns = p.turns.filter(x => !x.pending); p.busy = false; render(); return; }
      else { p.turns = p.turns.filter(x => !x.pending); p.err = t("guestErr"); p.busy = false; render(); return; }
    }
  }
  if(reply == null){
    p.scripted = true;
    await new Promise(r => setTimeout(r, 650));
    const lines = sc.script[state.lang];
    reply = lines[Math.min(p.script, lines.length-1)]; p.script++;
  }
  const last = p.turns[p.turns.length-1];
  if(last && last.pending){ last.text = reply; delete last.pending; }
  p.busy = false; p.ctl = null;
  render(); scrollChat(true);
}

  const p = state.practice; if(!p) return;

  const sc = SCEN[p.id];

  const s = await samplePromise;
  if(s && !aiDenied && !p.scripted){
    const lang = state.lang === "fr" ? "French" : "English";
    const transcript = p.turns.filter(x => !x.pending).map(x => `${x.who==="waiter"?"WAITER":"GUEST"}: ${x.text}`).join("\n");
    const prompt = `You are a demanding but kind trainer for a luxury, festive restaurant (Ondine, Dubai). Score the WAITER in this practice conversation.
Scenario: ${sc.brief.en} Goal: ${sc.goal.en}
Menu facts (the only truth):
${menuFacts()}
Transcript:
${transcript}
Reply with only JSON in this shape:
{"overall": integer 0-100, "scores": {"knowledge": 0-10, "selling": 0-10, "hospitality": 0-10, "safety": 0-10}, "went_well": [max 2 short strings], "improve": [max 2 short strings], "try_saying": "one better line the waiter could have said"}
"safety" means accuracy about facts and allergens. Any wrong or unchecked allergen claim caps "overall" at 40. Be specific to what the waiter actually said. Write every string in ${lang}.`;
    try{

function normFb(fb, sc){

function importPrompt(text){
  return `You turn a restaurant menu into staff-training content for a luxury venue.
Read the menu below and reply with ONLY a JSON array, one object per dish or drink, in this exact shape:
{"name": string, "category": "food" | "bar" | "wine", "price_aed": number or null, "description_en": string, "description_fr": string, "ingredients_en": [string], "ingredients_fr": [string], "allergens_stated": [code], "allergens_to_check": [{"ingredient_en": string, "ingredient_fr": string, "code": code}], "pronunciation": string}
Rules:
- Use only facts written on the menu. Never invent ingredients, origins or prices.
- description_en and description_fr: one appetising sentence each, built only from the menu text.
- allergens_stated: ONLY allergens the menu text explicitly declares next to the item (for example "contains milk"). If none is written, use [].
- allergens_to_check: ingredients listed on the menu that commonly contain one of the allergens, for the manager to confirm. Do not repeat codes already in allergens_stated.
- pronunciation: a simple English respelling of a foreign dish or wine name (like "rwee-NAR"), or "" if not needed.
- Allowed codes: ${Object.keys(ALG).join(", ")}.
Menu:
"""
${text.slice(0, 12000)}
"""`;
}
let impN = 0;
function addImported(arr){
  const codes = Object.keys(ALG);
  const items = (Array.isArray(arr) ? arr : []).filter(x => x && x.name).slice(0, 40).map(x => {
    const stated = (Array.isArray(x.allergens_stated) ? x.allergens_stated : []).map(String).filter(c => codes.includes(c));
    const checks = (Array.isArray(x.allergens_to_check) ? x.allergens_to_check : []).filter(c => c && codes.includes(String(c.code)) && !stated.includes(String(c.code)))
      .map(c => ({ingr:{en:String(c.ingredient_en || c.ingredient || ""), fr:String(c.ingredient_fr || c.ingredient_en || c.ingredient || "")}, code:String(c.code), ok:false}));
    const cat = ["food","bar","wine"].includes(x.category) ? x.category : "food";
    const pr = Number(x.price_aed);
    return {id:"imp" + (++impN), cat, name:String(x.name).slice(0,80), price: Number.isFinite(pr) && pr > 0 ? pr : null, status:"pending", imported:true,
      desc:{en:String(x.description_en || ""), fr:String(x.description_fr || x.description_en || "")},
      ingr:{en:(Array.isArray(x.ingredients_en)?x.ingredients_en:[]).map(String), fr:(Array.isArray(x.ingredients_fr)?x.ingredients_fr:(x.ingredients_en||[])).map(String)},
      allergens:stated, checks, say: x.pronunciation ? {w:"", ph:String(x.pronunciation)} : null};
  });
  ITEMS.push(...items);
  return items.length;
}

const reduceMotion = () => { try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } };
const memo = new Map();   // last value shown per counter, ring and bar, so re-renders do not replay them
function animate(){
  const rm = reduceMotion();
  document.querySelectorAll("[data-count]").forEach(el => {
    const key = "c:" + el.dataset.key, to = Number(el.dataset.count);
    const from = memo.has(key) ? memo.get(key) : 0; memo.set(key, to);
    if(rm || from === to || !Number.isFinite(to)) return;
    const start = performance.now(), dur = 950;
    el.textContent = fmtNum(Math.round(from));
    const step = now => {
      if(!el.isConnected) return;
      const k = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmtNum(Math.round(from + (to - from) * e));
      if(k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
  document.querySelectorAll(".ring-v").forEach(el => {
    const key = "r:" + el.dataset.key, C = Number(el.dataset.c), to = Number(el.dataset.v);
    const from = memo.has(key) ? memo.get(key) : 0; memo.set(key, to);
    if(rm || from === to) return;
    el.style.transition = "none";
    el.style.strokeDashoffset = String(C * (1 - from / 100));
    el.getBoundingClientRect();
    requestAnimationFrame(() => { el.style.transition = ""; el.style.strokeDashoffset = String(C * (1 - to / 100)); });
  });
  document.querySelectorAll("[data-bar]").forEach(el => {
    const key = "b:" + el.dataset.bar, to = Number(el.dataset.v);
    const from = memo.has(key) ? memo.get(key) : 0; memo.set(key, to);
    if(rm || from === to) return;
    el.style.transition = "none";
    el.style.width = from + "%";
    el.getBoundingClientRect();
    requestAnimationFrame(() => { el.style.transition = ""; el.style.width = to + "%"; });
  });
}

function celebrate(){
  if(reduceMotion()) return;
  const cv = document.createElement("canvas"); cv.className = "fx"; cv.setAttribute("aria-hidden", "true");
  document.body.appendChild(cv);
  const W = innerWidth, H = innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); if(!g){ cv.remove(); return; }
  g.scale(dpr, dpr);
  const golds = ["#C9A96E", "#E4CF9F", "#F3E5C2", "#A88A52"];
  const parts = [];
  for(let i = 0; i < 64; i++) parts.push({b:true, x:Math.random()*W, y:H + Math.random()*H*.5, r:2 + Math.random()*6, vy:-(1.4 + Math.random()*2.6), ph:Math.random()*6.28, a:.35 + Math.random()*.45});
  for(let i = 0; i < 90; i++) parts.push({b:false, x:W/2 + (Math.random() - .5)*W*.35, y:H*.32, vx:(Math.random() - .5)*10, vy:-(4 + Math.random()*7), w:5 + Math.random()*5, h:3 + Math.random()*3, rot:Math.random()*6.28, vr:(Math.random() - .5)*.3, col:golds[i % 4]});
  const start = performance.now(), dur = 3200;
  const frame = now => {
    const el = now - start, fade = el > dur - 700 ? Math.max(0, (dur - el) / 700) : 1;
    g.clearRect(0, 0, W, H);
    for(const p of parts){
      if(p.b){
        p.y += p.vy; p.x += Math.sin(el / 280 + p.ph) * .6;
        g.globalAlpha = p.a * fade; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.283);
        g.strokeStyle = "#E4CF9F"; g.lineWidth = 1.2; g.stroke();
        g.globalAlpha = p.a * fade * .22; g.fillStyle = "#F3E5C2"; g.fill();
      } else {
        p.vy += .22; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        g.save(); g.globalAlpha = fade; g.translate(p.x, p.y); g.rotate(p.rot);
        g.fillStyle = p.col; g.fillRect(-p.w/2, -p.h/2, p.w, Math.max(1, p.h * Math.abs(Math.cos(p.rot * 2)))); g.restore();
      }
    }
    if(el < dur) requestAnimationFrame(frame); else cv.remove();
  };
  requestAnimationFrame(frame);
}

  nextQ(){ const q = state.quiz; if(!q) return; if(q.i + 1 < q.qs.length){ q.i++; q.picked = null; } else { q.done = true; clearInterval(timerId); state.lastScores[q.mode] = q.score; ME.quizPct.push(pct(q.score, q.qs.length)); if(q.mode === "briefing") ME.brief = q.score; } render({enter:true}); window.scrollTo(0,0); },
  practice(id){ startPractice(id); render({enter:true}); window.scrollTo(0,0); },
  practiceHome(){ if(state.practice && state.practice.ctl) state.practice.ctl.abort(); state.practice = null; render({enter:true}); window.scrollTo(0,0); },
  send(){ sendWaiter(); },
  stopGuest(){ const p = state.practice; if(p && p.ctl) p.ctl.abort(); },
  feedback(){ getFeedback(); },
  import(){ runImport(); },
  stopImport(){ if(state.imp.ctl) state.imp.ctl.abort(); },
  resetImport(){ state.importText = SAMPLE_MENU; state.imp = {status:"idle"}; render(); },
  check(a){ const [id,k] = a.split(":"); const it = byId(id); if(!it) return; const c = it.checks[Number(k)]; if(c){ c.ok = !c.ok; render(); } },
  approve(id){ const it = byId(id); if(!it) return; const add = it.checks.filter(c => c.ok).map(c => c.code); it.allergens = [...new Set([...it.allergens, ...add])]; it.checks = []; it.status = "live"; render(); toast(t("published")(t("catBible")[it.cat])); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if(f){ e.preventDefault(); f(el.dataset.arg, el); }
});
document.addEventListener("input", e => {
  if(e.target.id === "chatInput" && state.practice) state.practice.draft = e.target.value;
  if(e.target.id === "impText") state.importText = e.target.value;
});
document.addEventListener("input", e => {
  if(e.target.id === "chatInput"){ e.target.style.height = "auto"; e.target.style.height = Math.min(160, e.target.scrollHeight) + "px"; }
});
document.addEventListener("keydown", e => {
  if(e.target.id === "chatInput" && e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendWaiter(); }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && state.openItem && state.tab === "bible"){ e.preventDefault(); ACT.closeSheet(); }
});
render({enter:true});
</script>
</body>
</html>
